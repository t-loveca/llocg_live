<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ラブカライフ！CUP　きらめきクイズ結果発表</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=RocknRoll+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DotGothic16&display=swap" rel="stylesheet" />
<style>
  :root {
    /* --- night sky --- */
    --sky-0:  #0a0620;
    --sky-1:  #140c33;
    --sky-2:  #1d1147;
    --bg-card: rgba(29, 19, 66, 0.72);
    --bg-soft: rgba(46, 30, 92, 0.55);
    --line: rgba(180, 150, 255, 0.18);
    --line-strong: rgba(190, 165, 255, 0.34);

    --text: #f4eeff;
    --text-dim: #b7a8d8;
    --text-faint: #7d6ca8;

    /* --- firework sparks --- */
    --accent:   #ff4d97;   /* magenta shell */
    --accent-2: #ffd166;   /* gold shell   */
    --accent-3: #5fe0ff;   /* cyan shell   */
    --accent-4: #b47bff;   /* violet shell */
    --accent-5: #7dffb0;   /* green shell  */
    --accent-soft: rgba(255, 77, 151, 0.16);

    --c-pink:#ff6fb0; --c-red:#ff6b6b; --c-yellow:#ffd166;
    --c-green:#5fe3a0; --c-blue:#5fb8ff; --c-purple:#c08bff; --c-gray:#8b7bb0;

    --shadow-sm: 0 2px 10px rgba(0,0,0,.35);
    --shadow-md: 0 10px 34px rgba(0,0,0,.45);
    --glow-pink: 0 0 24px rgba(255,77,151,.55), 0 8px 28px rgba(255,77,151,.28);
    --glow-gold: 0 0 26px rgba(255,209,102,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Kosugi Maru", "Zen Kaku Gothic New", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    background: var(--sky-0); color: var(--text);
    min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* deep night gradient + distant glow of shells */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(680px 500px at 82% 8%,  rgba(255,77,151,.22), transparent 62%),
      radial-gradient(560px 440px at 12% 22%, rgba(95,224,255,.16), transparent 62%),
      radial-gradient(600px 460px at 66% 62%, rgba(180,123,255,.18), transparent 62%),
      radial-gradient(520px 400px at 26% 78%, rgba(255,209,102,.13), transparent 62%),
      linear-gradient(180deg, var(--sky-0) 0%, var(--sky-1) 45%, var(--sky-2) 100%);
  }
  /* starfield */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .85;
    background-image:
      radial-gradient(circle at 8% 12%,  rgba(255,255,255,.95) 1.1px, transparent 1.8px),
      radial-gradient(circle at 34% 6%,  rgba(255,255,255,.65) .9px, transparent 1.6px),
      radial-gradient(circle at 61% 16%, rgba(255,255,255,.85) 1.1px, transparent 1.8px),
      radial-gradient(circle at 88% 28%, rgba(255,255,255,.6)  .9px, transparent 1.6px),
      radial-gradient(circle at 18% 44%, rgba(255,255,255,.75) 1px,  transparent 1.7px),
      radial-gradient(circle at 74% 52%, rgba(255,255,255,.55) .9px, transparent 1.6px),
      radial-gradient(circle at 45% 72%, rgba(255,255,255,.8)  1.1px, transparent 1.8px),
      radial-gradient(circle at 92% 84%, rgba(255,255,255,.6)  .9px, transparent 1.6px),
      radial-gradient(circle at 22% 92%, rgba(255,255,255,.7)  1px,  transparent 1.7px);
    background-size: 620px 620px, 540px 540px, 700px 700px, 580px 580px, 660px 660px,
                     520px 520px, 720px 720px, 600px 600px, 640px 640px;
    animation: twinkle 5.5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity:.85 } 50% { opacity:.5 } }

  /* bursting fireworks layer */
  .fireworks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .fw {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    opacity: 0; animation: burst 4.6s ease-out infinite;
  }
  .fw::before, .fw::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%;
    box-shadow:
        0    -34px 0 -1px currentColor,  24px -24px 0 -1px currentColor,
       34px    0px 0 -1px currentColor,  24px  24px 0 -1px currentColor,
        0     34px 0 -1px currentColor, -24px  24px 0 -1px currentColor,
      -34px    0px 0 -1px currentColor, -24px -24px 0 -1px currentColor;
  }
  .fw::after {
    box-shadow:
        0    -60px 0 -2px currentColor,  42px -42px 0 -2px currentColor,
       60px    0px 0 -2px currentColor,  42px  42px 0 -2px currentColor,
        0     60px 0 -2px currentColor, -42px  42px 0 -2px currentColor,
      -60px    0px 0 -2px currentColor, -42px -42px 0 -2px currentColor;
  }
  @keyframes burst {
    0%   { opacity: 0; transform: scale(.2); }
    6%   { opacity: 1; }
    38%  { opacity: .85; transform: scale(1.15); }
    62%  { opacity: 0;  transform: scale(1.5); }
    100% { opacity: 0;  transform: scale(1.5); }
  }
  .fw.a { color: var(--accent);   top: 16%; left: 12%; animation-delay: 0s;    }
  .fw.b { color: var(--accent-2); top: 10%; left: 74%; animation-delay: 1.1s;  }
  .fw.c { color: var(--accent-3); top: 34%; left: 88%; animation-delay: 2.3s;  }
  .fw.d { color: var(--accent-4); top: 52%; left: 22%; animation-delay: 3.1s;  }
  .fw.e { color: var(--accent-5); top: 24%; left: 46%; animation-delay: 1.8s;  }
  .fw.f { color: var(--accent);   top: 66%; left: 68%; animation-delay: 3.8s;  }
  @media (prefers-reduced-motion: reduce) {
    .fw { animation: none; opacity: .35; }
    body::after { animation: none; }
  }

  .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  /* Title */
  .titlebar { text-align: center; padding: 40px 16px 24px; }
  .titlebar h1 {
    font-family: "RocknRoll One", sans-serif;
    font-size: clamp(28px, 5.4vw, 52px); line-height: 1.2; margin: 0;
    color: var(--text); position: relative; display: inline-block;
    text-shadow: 0 0 26px rgba(180,123,255,.5), 0 2px 20px rgba(0,0,0,.6);
  }
  .titlebar h1 .accent {
    background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 45%, var(--accent-4) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,77,151,.55));
  }
  .titlebar h1::before, .titlebar h1::after {
    content: "✧"; position: absolute; font-size: .46em; top: -6px; opacity: .9;
    animation: sparkle 2.6s ease-in-out infinite;
  }
  .titlebar h1::before { left: -34px; color: var(--accent-2); }
  .titlebar h1::after  { right: -34px; color: var(--accent-3); animation-delay: 1.3s; }
  @keyframes sparkle {
    0%,100% { transform: scale(.85) rotate(0deg);   opacity:.6 }
    50%     { transform: scale(1.25) rotate(180deg); opacity:1 }
  }
  .titlebar .deco { margin-top: 22px; display: flex; justify-content: center; gap: 9px; }
  .titlebar .deco span {
    width: 9px; height: 9px; border-radius: 50%;
    animation: emberPulse 2.4s ease-in-out infinite;
  }
  /* blade-heart colours: 桃 / 赤 / 黄 / 緑 / 青 / 紫 */
  .titlebar .deco span:nth-child(1){background:var(--c-pink);   box-shadow:0 0 12px var(--c-pink);   animation-delay:0s}
  .titlebar .deco span:nth-child(2){background:var(--c-red);    box-shadow:0 0 12px var(--c-red);    animation-delay:.25s}
  .titlebar .deco span:nth-child(3){background:var(--c-yellow); box-shadow:0 0 12px var(--c-yellow); animation-delay:.5s}
  .titlebar .deco span:nth-child(4){background:var(--c-green);  box-shadow:0 0 12px var(--c-green);  animation-delay:.75s}
  .titlebar .deco span:nth-child(5){background:var(--c-blue);   box-shadow:0 0 12px var(--c-blue);   animation-delay:1s}
  .titlebar .deco span:nth-child(6){background:var(--c-purple); box-shadow:0 0 12px var(--c-purple); animation-delay:1.25s}
  @keyframes emberPulse { 0%,100%{transform:scale(1);opacity:.75} 50%{transform:scale(1.35);opacity:1} }
  .titlebar .build-stamp {
    margin-top: 14px; font-family: "DotGothic16", monospace; font-size: 10px;
    color: var(--text-faint); letter-spacing: .12em; opacity: .7;
  }

  /* glass panel base */
  .glass {
    background: var(--bg-card);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
  }

  /* Start screen */
  .start-screen { margin: 30px auto 0; max-width: 560px; display: flex; flex-direction: column; gap: 18px; }
  .step-card {
    background: var(--bg-card);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 2px dashed rgba(255,77,151,.45); border-radius: 26px;
    padding: 26px 26px 28px; text-align: center; box-shadow: var(--shadow-md);
    position: relative; overflow: hidden; transition: opacity .3s, border-color .3s;
  }
  .step-card.disabled { opacity: .5; border-color: rgba(150,130,200,.22); pointer-events: none; }
  .step-card.done {
    border-style: solid; border-color: rgba(125,255,176,.45);
    box-shadow: var(--shadow-md), 0 0 30px rgba(125,255,176,.14);
  }
  .step-card::before {
    content:""; position:absolute; top:-50px; right:-50px; width:140px; height:140px;
    background: radial-gradient(circle, rgba(255,209,102,.28), transparent 70%); border-radius:50%; pointer-events:none;
  }
  .step-card::after {
    content:""; position:absolute; bottom:-40px; left:-40px; width:120px; height:120px;
    background: radial-gradient(circle, rgba(95,224,255,.2), transparent 70%); border-radius:50%; pointer-events:none;
  }
  .step-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; position:relative; }
  .step-badge {
    font-family: "RocknRoll One", sans-serif; font-size: 11px; letter-spacing: .16em; color: #1a0f33;
    background: linear-gradient(135deg, var(--accent-2), var(--accent)); padding: 4px 12px; border-radius: 100px;
    box-shadow: var(--glow-gold);
  }
  .step-card.disabled .step-badge { background: rgba(150,130,200,.3); color: var(--text-faint); box-shadow:none; }
  .step-card.done .step-badge { background: linear-gradient(135deg, var(--accent-5), #4fd99a); box-shadow: 0 0 18px rgba(125,255,176,.5); }
  .step-check {
    width: 28px; height: 28px; border-radius: 50%; background: var(--accent-5); color: #0d2a1c;
    font-family: "RocknRoll One", sans-serif; font-size: 16px; display: none;
    align-items: center; justify-content: center; box-shadow: 0 0 18px rgba(125,255,176,.6);
  }
  .step-card.done .step-check { display: inline-flex; }
  .step-card h3 {
    margin: 4px 0 6px; font-family: "RocknRoll One", sans-serif; font-size: 19px; position: relative;
    text-shadow: 0 0 18px rgba(180,123,255,.4);
  }
  .step-card p { margin: 0 0 18px; font-size: 12px; color: var(--text-dim); line-height: 1.7; position: relative; }
  .step-status { margin-top: 12px; font-size: 12px; color: var(--text-dim); min-height: 18px; position: relative; }
  .step-status.success { color: var(--accent-5); font-weight: 700; }
  .step-status.error { color: #ff8b8b; }

  .upload-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(255,77,151,.1); color: var(--accent); border: 2px solid var(--accent);
    padding: 13px 28px; border-radius: 100px; font-family: "RocknRoll One", sans-serif;
    font-size: 15px; cursor: pointer; transition: all .2s; position: relative;
  }
  .upload-btn:hover { background: var(--accent); color: #fff; transform: translateY(-2px); box-shadow: var(--glow-pink); }
  .upload-btn.primary {
    background: linear-gradient(135deg, var(--accent), #ff7ec0); color: #fff;
    border-color: transparent; box-shadow: var(--glow-pink); padding: 16px 32px; font-size: 16px;
  }
  .upload-btn.primary:hover { transform: translateY(-3px) scale(1.02); }
  .upload-btn input { display: none; }
  .upload-btn .btn-icon { font-size: 16px; line-height: 1; }

  /* Q8-10 answer-image slots on the start screen */
  .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; position: relative; }
  @media (max-width: 460px) { .slot-grid { grid-template-columns: 1fr; } }
  .slot {
    display: block; cursor: pointer; border-radius: 16px; padding: 12px 8px 10px;
    border: 2px dashed rgba(255,77,151,.4); background: var(--bg-soft);
    transition: all .22s; text-align: center; position: relative; overflow: hidden;
  }
  .slot:hover, .slot.dragover { border-color: var(--accent); box-shadow: 0 0 22px rgba(255,77,151,.25); }
  .slot.filled { border-style: solid; border-color: rgba(125,255,176,.5); }
  .slot input { display: none; }
  .slot .slot-q {
    font-family: "RocknRoll One", sans-serif; font-size: 12px; color: var(--accent-2);
    letter-spacing: .08em; text-shadow: 0 0 12px rgba(255,209,102,.5);
  }
  .slot .slot-thumb {
    margin: 8px auto 0; width: 100%; aspect-ratio: 4/3; border-radius: 10px;
    background: rgba(10,6,32,.55); display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: var(--text-faint); font-size: 20px;
  }
  .slot .slot-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot .slot-cap { margin-top: 7px; font-size: 10px; color: var(--text-dim); line-height: 1.4; }
  .slot .slot-clear {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
    border: none; background: rgba(10,6,32,.75); color: var(--text-dim);
    font-size: 12px; line-height: 1; cursor: pointer; display: none; align-items: center; justify-content: center;
  }
  .slot.filled .slot-clear { display: inline-flex; }
  .slot .slot-clear:hover { color: #ff8b8b; }

  /* Quiz screen */
  .quiz-screen { display: none; }
  .quiz-screen.active { display: block; }
  .quiz-toolbar { display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap; }
  .quiz-toolbar .tally { font-size: 12px; color: var(--text-dim); margin-right: auto; }
  .quiz-toolbar .tally b {
    color: var(--accent-2); font-weight: normal; font-size: 16px;
    font-family: "RocknRoll One", sans-serif; margin: 0 2px; text-shadow: 0 0 14px rgba(255,209,102,.6);
  }
  .reupload-btn {
    background: var(--bg-soft); border: 1px solid var(--line-strong); color: var(--text-dim);
    font-size: 12px; padding: 8px 16px; border-radius: 100px; cursor: pointer;
    transition: all .2s; display: inline-flex; align-items: center;
  }
  .reupload-btn:hover { color: var(--accent); border-color: var(--accent); }
  .reupload-btn input { display: none; }

  .tabs { display:flex; gap:8px; overflow-x:auto; padding:8px 4px; margin:22px 0 16px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex: 0 0 auto; background: var(--bg-soft); border: 1px solid var(--line); color: var(--text-dim);
    padding: 9px 15px; border-radius: 100px; font-family: "Kosugi Maru", sans-serif; font-size: 13px;
    cursor: pointer; transition: all .2s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .tab:hover { border-color: rgba(255,77,151,.6); color: var(--text); transform: translateY(-1px); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), #ff7ec0); color: #fff;
    border-color: transparent; box-shadow: var(--glow-pink); transform: translateY(-1px);
  }
  .tab .num { font-family: "DotGothic16", monospace; font-size: 11px; opacity: .85; }
  .tab.answered { border-color: rgba(125,255,176,.55); }
  .tab.answered::after { content: "✓"; color: var(--accent-5); font-size: 11px; }
  .tab.active.answered::after { color: #fff; }

  .stage {
    background: var(--bg-card);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 28px;
    padding: 32px 34px 38px; box-shadow: var(--shadow-md); min-height: 440px; position: relative;
    overflow: hidden;
  }
  .stage::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-2), var(--accent), var(--accent-4), transparent);
    opacity: .85;
  }
  @media (max-width: 600px) { .stage { padding: 24px 18px 28px; border-radius: 22px; } }
  .stage.fade-in { animation: fadeIn .4s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:translateY(0);} }

  /* Question block */
  .q-badge {
    display: inline-block; font-family: "RocknRoll One", sans-serif; font-size: 12px;
    letter-spacing: .12em; color: #1a0f33;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    padding: 5px 14px; border-radius: 100px; box-shadow: var(--glow-gold);
  }
  .q-text {
    font-family: "RocknRoll One", sans-serif;
    font-size: clamp(17px, 2.5vw, 23px); line-height: 1.55; margin: 14px 0 0; color: var(--text);
    text-shadow: 0 0 20px rgba(180,123,255,.35);
  }
  .q-note {
    margin-top: 10px; font-size: 12px; line-height: 1.85; color: var(--text-dim);
    background: var(--bg-soft); border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0; padding: 10px 14px; white-space: pre-line;
  }
  .q-divider { border: 0; border-top: 1px dashed var(--line-strong); margin: 22px 0 0; }

  /* Reveal */
  .reveal-wrap { text-align: center; padding: 40px 0 20px; }
  .reveal-btn {
    background: linear-gradient(135deg, var(--accent-2), var(--accent) 55%, var(--accent-4)); color: #fff; border: none;
    padding: 18px 46px; border-radius: 100px; font-family: "RocknRoll One", sans-serif;
    font-size: 18px; cursor: pointer; box-shadow: var(--glow-pink); transition: transform .2s, box-shadow .2s;
    text-shadow: 0 1px 6px rgba(0,0,0,.35);
  }
  .reveal-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 40px rgba(255,77,151,.7); }
  .reveal-hint { margin-top: 14px; font-size: 12px; color: var(--text-faint); }

  .answer-block { animation: popIn .55s cubic-bezier(.2,.9,.3,1.2); padding-top: 22px; }
  @keyframes popIn { from { opacity:0; transform: scale(.94) translateY(12px);} to { opacity:1; transform:scale(1) translateY(0);} }

  .answer-hero {
    display: flex; align-items: center; gap: 22px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, rgba(255,209,102,.16), rgba(255,77,151,.12) 55%, rgba(180,123,255,.14));
    border: 1px solid rgba(255,209,102,.5); border-radius: 22px; padding: 24px 26px;
    box-shadow: 0 0 40px rgba(255,209,102,.16), inset 0 0 40px rgba(255,209,102,.05);
  }
  @media (max-width: 560px) { .answer-hero { flex-direction: column; text-align: center; gap: 16px; } }
  .answer-hero .ans-img {
    flex: 0 0 auto; width: 132px; border-radius: 12px; overflow: hidden;
    background: rgba(10,6,32,.5); position: relative; box-shadow: 0 6px 26px rgba(0,0,0,.5);
  }
  .answer-hero .ans-img.member { aspect-ratio: 5/7; }
  .answer-hero .ans-img.live { width: 200px; aspect-ratio: 7/5; }
  .answer-hero .ans-img img { width: 100%; height: 100%; display: block; object-fit: contain; }
  .answer-hero .ans-img img.broken { display: none; }
  .answer-hero .ans-img .fb {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); font-size: 11px; font-family: "DotGothic16", monospace;
  }
  .answer-hero .ans-body { min-width: 0; flex: 1 1 auto; }
  .answer-hero .ans-label {
    font-family: "RocknRoll One", sans-serif; font-size: 12px; letter-spacing: .24em;
    color: var(--accent-2); margin-bottom: 6px; text-shadow: 0 0 16px rgba(255,209,102,.7);
  }
  .answer-hero .ans-name {
    font-family: "RocknRoll One", sans-serif;
    font-size: clamp(22px, 3.6vw, 34px); line-height: 1.25; color: #fff; word-break: break-word;
    text-shadow: 0 0 28px rgba(255,209,102,.45), 0 2px 12px rgba(0,0,0,.5);
  }
  .answer-hero .ans-sub { font-size: 12px; color: var(--text-dim); margin-top: 6px; font-family: "DotGothic16", monospace; }
  .answer-hero .ans-count {
    margin-top: 12px; display: inline-block;
    background: linear-gradient(135deg, var(--accent), #ff7ec0); color: #fff;
    font-family: "RocknRoll One", sans-serif; font-size: 18px;
    padding: 7px 20px; border-radius: 100px; box-shadow: var(--glow-pink);
  }

  .rank-title {
    margin: 28px 0 12px; font-size: 12px; color: var(--text-faint);
    font-family: "DotGothic16", monospace; letter-spacing: .1em;
  }

  /* Ranking rows */
  .rank-list { display: flex; flex-direction: column; gap: 11px; }
  .rank-row { display: grid; grid-template-columns: 36px minmax(0,1fr) 70px; gap: 12px; align-items: center; }
  .rank-pos {
    font-family: "RocknRoll One", sans-serif; font-size: 13px; color: var(--text-faint);
    text-align: center; background: var(--bg-soft); border-radius: 100px; padding: 4px 0; line-height: 1;

  /* Image question (Q8-10) */

  .answer-image-wrap img {
    max-width: 100%; max-height: 620px; border-radius: 18px;

    border: 1px solid var(--line-strong);

  .mini-btn {

    font-family: "Kosugi Maru", sans-serif; font-size: 12px; padding: 8px 18px;

    padding: 12px 22px; border-radius: 100px; font-family: "Kosugi Maru", sans-serif;

<script>
"use strict";

let CARDS = null;
let DECKS = [];
let AGG = null;
let CUR_PAGE = 0;
const REVEALED = Object.create(null);   // pageId -> true
const QIMAGES  = Object.create(null);   // pageId -> dataURL

const HEART_KEYS = ["b_heart01","b_heart02","b_heart03","b_heart04","b_heart05","b_heart06"];
// cards.json has used two spellings for the 蓮ノ空 series over time;
// both map to the same bucket so older and newer files both work.
const SERIES_ALIAS = {
  "蓮ノ空女学院スクールアイドルクラブ": "ラブライブ！蓮ノ空女学院スクールアイドルクラブ",
};
const KNOWN_SERIES = new Set([
  "ラブライブ！",
  "ラブライブ！サンシャイン!!",
  "ラブライブ！虹ヶ咲学園スクールアイドル同好会",
  "ラブライブ！スーパースター!!",
  "ラブライブ！蓮ノ空女学院スクールアイドルクラブ",
]);
function canonSeries(s) { return SERIES_ALIAS[s] || s; }
const SERIES_CLASS = {
  "ラブライブ！": "ser-llo",
  "ラブライブ！サンシャイン!!": "ser-aqu",
  "ラブライブ！虹ヶ咲学園スクールアイドル同好会": "ser-nzk",
  "ラブライブ！スーパースター!!": "ser-ssss",
  "ラブライブ！蓮ノ空女学院スクールアイドルクラブ": "ser-hns",
  "その他": "ser-other",
};

// ============== HELPERS ==============
function fmt(n) { return n.toLocaleString("en-US"); }
function normalizeUnit(u) { return u ? u.replace(/！/g, "!") : null; }
function nameKey(n) { return (n || "").replace(/[\s\u3000]/g, ""); }
function hasSpace(n) { return /[\s\u3000]/.test(n || ""); }
// 2nd segment of a card number = the set code ("PR", "bp7", "pb1", ...)
function setCode(cardNo) {
  const p = (cardNo || "").split("-");
  return p.length >= 2 ? p[1] : "";
}
function baseNo(cardNo) {
  const p = (cardNo || "").split("-");
  return p.length > 1 ? p.slice(0, -1).join("-") : cardNo;
}
// Card numbers are PREFIX-SET-NUM (deck CSV) or PREFIX-SET-NUM-RARITY (cards.json).
// Drop the rarity only when it is actually present, so per-card grouping
// never collapses different cards of the same set together.
function canonNo(cardNo) {
  const p = (cardNo || "").split("-");
  return p.length >= 4 ? p.slice(0, 3).join("-") : cardNo;
}
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k === "data") { for (const [dk, dv] of Object.entries(v)) e.dataset[dk] = dv; }
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") e.innerHTML = v;
    else if (v != null) e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}

// A name-merging accumulator: merges by name ignoring spaces,
// preferring the spaced form for display.
function makeNameTally() {
  const m = new Map();
  return {
    add(name, cnt, img) {
      const key = nameKey(name);
      const ex = m.get(key);
      if (ex) {
        ex.count += cnt;
        if (!ex.spaced && hasSpace(name)) { ex.display = name; ex.spaced = true; }
        if (!ex.img && img) ex.img = img;
      } else {
        m.set(key, { display: name, count: cnt, spaced: hasSpace(name), img: img || null });
      }
    },
    entries() {
      return Array.from(m.values())
        .map(v => ({ name: v.display, count: v.count, img: v.img }))
        .sort((a, b) => b.count - a.count);
    },
  };
}

// A per-card accumulator keyed by base card number.
function makeCardTally() {
  const m = new Map();
  return {
    add(cardNo, name, cnt, img) {
      const key = canonNo(cardNo);
      const ex = m.get(key);
      if (ex) { ex.count += cnt; if (!ex.img && img) ex.img = img; }
      else m.set(key, { code: key, name, count: cnt, img: img || null });
    },
    entries() {
      return Array.from(m.values()).sort((a, b) => b.count - a.count);
    },
  };
}

function mapToEntries(map) {
  return Array.from(map.entries())
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => {
      if (a.name === "その他" && b.name !== "その他") return 1;
      if (b.name === "その他" && a.name !== "その他") return -1;
      return b.count - a.count;
    });
}

// ============== AGGREGATION ==============
function buildCardLookup(cards) {
  // Deck CSVs use card numbers without the rarity suffix ("PL!S-PR-025"),
  // while cards.json keys include it ("PL!S-PR-025-PR"). Index both.
  const lookup = Object.create(null);
  for (const k of Object.keys(cards)) {
    const card = cards[k];
    if (!(k in lookup)) lookup[k] = card;
    const b = baseNo(k);
    if (b !== k && !(b in lookup)) lookup[b] = card;
  }
  return lookup;
}

function aggregate(decks, cards) {
  const LOOKUP = buildCardLookup(cards);

  const series = new Map();
  const unit = new Map();
  const member = makeNameTally();      // Q2
  const noBlade = makeNameTally();     // Q4
  const prMember = makeNameTally();    // Q5
  const bp7Member = makeCardTally();   // Q6
  const bp7Live = makeCardTally();     // Q7

  let totalCards = 0;

  for (const d of decks) {
    for (const e of d.entries) {
      const c = LOOKUP[e.card_no];
      const cnt = e.count;
      totalCards += cnt;
      if (!c) continue;

      // --- series (Q1): anything outside the five goes to その他
      const list = c.series
        ? c.series.split(/\n/).map(s => canonSeries(s.trim())).filter(Boolean)
        : [];
      const matched = list.filter(s => KNOWN_SERIES.has(s));
      if (matched.length) for (const s of matched) series.set(s, (series.get(s) || 0) + cnt);
      else series.set("その他", (series.get("その他") || 0) + cnt);

      const code = setCode(e.card_no);
      const isBp7 = code.toLowerCase() === "bp7" ||
                    /MELLOW\s*MOMENT/i.test(c.product || "");

      if (c.type === "メンバー") {
        const u = normalizeUnit(c.unit);
        if (u) unit.set(u, (unit.get(u) || 0) + cnt);       // Q3

        member.add(c.name, cnt, c.img);                      // Q2

        // Q4: members with no blade heart at all
        const bh = c.blade_heart || {};
        let bhSum = 0;
        for (const k of HEART_KEYS) bhSum += (bh[k] || 0);
        if (bhSum === 0) noBlade.add(c.name, cnt, c.img);

        // Q5: 初出が PR カード = set code is "PR" (rarity is irrelevant)
        if (code === "PR") prMember.add(c.name, cnt, c.img);

        // Q6
        if (isBp7) bp7Member.add(e.card_no, c.name, cnt, c.img);
      } else if (c.type === "ライブ") {
        // Q7
        if (isBp7) bp7Live.add(e.card_no, c.name, cnt, c.img);
      }
    }
  }

  return {
    series: mapToEntries(series),
    unit: mapToEntries(unit),
    member: member.entries(),
    noBlade: noBlade.entries(),
    prMember: prMember.entries(),
    bp7Member: bp7Member.entries(),
    bp7Live: bp7Live.entries(),
    totals: { players: decks.length, totalCards },
  };
}

// ============== RENDERERS ==============
function renderAnswerHero(top, opts) {
  const imgKind = opts.imgKind;   // "member" | "live" | null
  const body = el("div", { class: "ans-body" }, [
    el("div", { class: "ans-label" }, "ANSWER"),
    el("div", { class: "ans-name" }, top.name),
    top.code ? el("div", { class: "ans-sub" }, top.code) : null,
    el("div", { class: "ans-count" }, fmt(top.count) + " 枚"),
  ]);

  const children = [];
  if (imgKind) {
    const wrap = el("div", { class: "ans-img " + imgKind }, [ el("div", { class: "fb" }, "NO IMAGE") ]);
    if (top.img) {
      wrap.appendChild(el("img", {
        src: top.img, alt: "", referrerpolicy: "no-referrer",
        onerror(ev) { ev.target.classList.add("broken"); },
      }));
    }
    children.push(wrap);
  }
  children.push(body);
  return el("div", { class: "answer-hero" }, children);
}

function renderRanking(entries, opts = {}) {
  const limit = opts.limit || entries.length;
  const shown = entries.slice(0, limit);
  const max = Math.max(1, ...shown.map(e => e.count));
  const list = el("div", { class: "rank-list" });
  shown.forEach((e, i) => {
    const cls = i === 0 ? "rank-row top1" : i === 1 ? "rank-row top2" : i === 2 ? "rank-row top3" : "rank-row";
    const fillCls = opts.seriesColors ? (SERIES_CLASS[e.name] || "rank-bar-fill") : "rank-bar-fill";
    list.appendChild(el("div", { class: cls }, [
      el("div", { class: "rank-pos" }, String(i + 1).padStart(2, "0")),
      el("div", { class: "rank-bar-wrap" }, [
        el("div", { class: "rank-name", title: e.name }, [
          e.name,
          e.code ? el("span", { class: "code" }, e.code) : null,
        ]),
        el("div", { class: "rank-bar" }, [
          el("div", { class: fillCls, style: `width:${(e.count / max) * 100}%; height:100%; border-radius:6px;` }),
        ]),
      ]),
      el("div", { class: "rank-count" }, fmt(e.count)),
    ]));
  });
  return list;
}

// ============== QUIZ DEFINITION ==============
const PAGES = [
  {
    id: "q1", short: "シリーズ",
    question: "本大会で１番採用枚数の多いシリーズはどれでしょう？",
    data: a => a.series, imgKind: null, seriesColors: true, rankLimit: 6,
  },
  {
    id: "q2", short: "メンバー",
    question: "本大会で１番採用枚数の多いメンバーはどれでしょう？",
    note: "※カード番号が異なるものも合算します",
    data: a => a.member, imgKind: "member", rankLimit: 15,
  },
  {
    id: "q3", short: "ユニット",
    question: "本大会で１番採用枚数の多いユニットはどれでしょう？",
    data: a => a.unit, imgKind: null, rankLimit: 20,
  },
  {
    id: "q4", short: "非ブレード",
    question: "本大会で１番採用枚数の多いブレードハートを持たないメンバーカードは何でしょう？",
    note: "※カード番号が異なるものも合算します",
    data: a => a.noBlade, imgKind: "member", rankLimit: 15,
  },
  {
    id: "q5", short: "PR",
    question: "本大会で１番採用枚数の多いPRメンバーカードはどれでしょう？",
    note: "※レアリティではなく、初出が「PRカード」のものです。\n"
        + "　カード番号が異なるものも合算します。\n"
        + "例：《PL!S-PR-025-PR 高海千歌》であれば、RMが採用されていた場合も含みます。\n"
        + "　　《PL!-pb1-019-PR 高坂穂乃果》「pb1」が初出のため含まれません。",
    data: a => a.prMember, imgKind: "member", rankLimit: 15,
  },
  {
    id: "q6", short: "bp7メンバー",
    question: "本大会で１番採用枚数の多い新弾MELLOW MOMENT（bp7）のメンバーカードは何でしょう？",
    data: a => a.bp7Member, imgKind: "member", rankLimit: 15,
    emptyNote: "読み込んだ cards.json に bp7（MELLOW MOMENT）のメンバーカードが見つかりませんでした。\n最新の cards.json を STEP 1 で読み込んでください。",
  },
  {
    id: "q7", short: "bp7ライブ",
    question: "本大会で１番採用枚数の多い新弾MELLOW MOMENT（bp7）のライブカードは何でしょう？",
    data: a => a.bp7Live, imgKind: "live", rankLimit: 15,
    emptyNote: "読み込んだ cards.json に bp7（MELLOW MOMENT）のライブカードが見つかりませんでした。\n最新の cards.json を STEP 1 で読み込んでください。",
  },
  {
    id: "q8", short: "ファイル", image: true,
    question: "運営席にあるファイルに収納されている、？のライブカードを当ててください。",
  },
  {
    id: "q9", short: "エネルギー", image: true,
    question: "運営席にキャスト（女性声優）のエネルギーカードが裏向きで置かれています。誰か当ててください。",
  },
  {
    id: "q10", short: "[2]メンバー", image: true,
    question: "運営席にあるモノから[2]のメンバー名を当ててください。",
  },
];

// ============== STAGE ==============
function buildQuestionHead(p, idx) {
  return el("div", {}, [
    el("span", { class: "q-badge" }, `Q${idx + 1} / ${PAGES.length}`),
    el("p", { class: "q-text" }, p.question),
    p.note ? el("div", { class: "q-note" }, p.note) : null,
    el("hr", { class: "q-divider" }),
  ]);
}

function buildDataAnswer(p) {
  const entries = p.data(AGG);
  if (!entries.length) {
    return el("div", { class: "empty-note", style: "white-space:pre-line;" },
      p.emptyNote || "該当するカードが見つかりませんでした。");
  }
  if (!REVEALED[p.id]) {
    return el("div", { class: "reveal-wrap" }, [
      el("button", {
        class: "reveal-btn",
        onclick() { REVEALED[p.id] = true; renderStage(); renderTabs(); },
      }, "答えを見る"),
      el("div", { class: "reveal-hint" }, "クリックすると正解と全順位を表示します"),
    ]);
  }
  return el("div", { class: "answer-block" }, [
    renderAnswerHero(entries[0], { imgKind: p.imgKind }),
    el("div", { class: "rank-title" }, `RANKING — 全 ${entries.length} 件中 上位 ${Math.min(p.rankLimit || entries.length, entries.length)} 件`),
    renderRanking(entries, { limit: p.rankLimit, seriesColors: p.seriesColors }),
  ]);
}

function imagePages() { return PAGES.filter(p => p.image); }

function setQImage(pageId, file) {
  if (!file || !file.type || !file.type.startsWith("image/")) return;
  const r = new FileReader();
  r.onload = () => {
    QIMAGES[pageId] = r.result;
    REVEALED[pageId] = true;
    renderSlots();
    if (AGG) { renderStage(); renderTabs(); }
  };
  r.readAsDataURL(file);
}

function clearQImage(pageId) {
  delete QIMAGES[pageId];
  delete REVEALED[pageId];
  renderSlots();
  if (AGG) { renderStage(); renderTabs(); }
}

// --- Q8-10 answer-image slots (start screen) ---
function renderSlots() {
  const grid = document.getElementById("slot-grid");
  if (!grid) return;
  grid.innerHTML = "";
  const pages = imagePages();
  pages.forEach(p => {
    const filled = !!QIMAGES[p.id];
    const thumb = el("div", { class: "slot-thumb" },
      filled ? [ el("img", { src: QIMAGES[p.id], alt: "" }) ] : [ "\uD83D\uDDBC" ]);

    const slot = el("label", { class: "slot" + (filled ? " filled" : "") }, [
      el("div", { class: "slot-q" }, "Q" + (PAGES.indexOf(p) + 1)),
      thumb,
      el("div", { class: "slot-cap" }, p.short),
      el("input", { type: "file", accept: "image/*",
        onchange(ev) { setQImage(p.id, ev.target.files[0]); ev.target.value = ""; } }),
    ]);

    if (filled) {
      slot.appendChild(el("button", {
        class: "slot-clear", title: "削除",
        onclick(ev) { ev.preventDefault(); ev.stopPropagation(); clearQImage(p.id); },
      }, "\u00d7"));
    }

    slot.addEventListener("dragover", ev => { ev.preventDefault(); slot.classList.add("dragover"); });
    slot.addEventListener("dragleave", () => slot.classList.remove("dragover"));
    slot.addEventListener("drop", ev => {
      ev.preventDefault(); slot.classList.remove("dragover");
      if (ev.dataTransfer.files && ev.dataTransfer.files[0]) setQImage(p.id, ev.dataTransfer.files[0]);
    });
    grid.appendChild(slot);
  });

  const done = pages.filter(p => QIMAGES[p.id]).length;
  const card = document.getElementById("step-img");
  const status = document.getElementById("img-status");
  if (card) card.classList.toggle("done", done === pages.length && pages.length > 0);
  if (status) {
    status.className = "step-status" + (done ? " success" : "");
    status.textContent = done ? `\u2713 ${done} / ${pages.length} 枚を登録しました`
                              : "未登録でも発表は開始できます";
  }
}

// --- Q8-10 stage view (display only; upload happens on the start screen) ---
function buildImageAnswer(p) {
  if (QIMAGES[p.id]) {
    return el("div", { class: "answer-block answer-image-wrap" }, [
      el("img", { src: QIMAGES[p.id], alt: "解答画像" }),
    ]);
  }
  return el("div", { class: "empty-note", style: "white-space:pre-line;" },
    "解答画像がまだ登録されていません。\n最初のアップロード画面（STEP 2）で登録してください。");
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  PAGES.forEach((p, i) => {
    const done = p.image ? !!QIMAGES[p.id] : !!REVEALED[p.id];
    tabs.appendChild(el("button", {
      class: "tab" + (i === CUR_PAGE ? " active" : "") + (done ? " answered" : ""),
      onclick() { goTo(i); },
    }, [ el("span", { class: "num" }, "Q" + (i + 1)), p.short ]));
  });
}

function renderStage() {
  const stage = document.getElementById("stage");
  const p = PAGES[CUR_PAGE];
  stage.innerHTML = "";
  stage.classList.remove("fade-in"); void stage.offsetWidth; stage.classList.add("fade-in");

  stage.appendChild(buildQuestionHead(p, CUR_PAGE));
  stage.appendChild(p.image ? buildImageAnswer(p) : buildDataAnswer(p));

  document.getElementById("pn-cur").textContent = String(CUR_PAGE + 1);
  document.getElementById("pn-total").textContent = String(PAGES.length);
  document.getElementById("btn-prev").disabled = CUR_PAGE === 0;
  document.getElementById("btn-next").disabled = CUR_PAGE === PAGES.length - 1;

  const tabs = document.getElementById("tabs").children;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle("active", i === CUR_PAGE);
  if (tabs[CUR_PAGE]) tabs[CUR_PAGE].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

function goTo(i) {
  if (i < 0 || i >= PAGES.length) return;
  CUR_PAGE = i;
  renderStage();
  document.getElementById("stage").scrollIntoView({ behavior: "smooth", block: "start" });
}

function startQuiz(agg) {
  AGG = agg;
  CUR_PAGE = 0;
  // keep Q8-10 images; only clear the data-question reveals
  for (const k of Object.keys(REVEALED)) if (!QIMAGES[k]) delete REVEALED[k];
  document.getElementById("t-players").textContent = fmt(agg.totals.players);
  document.getElementById("t-cards").textContent = fmt(agg.totals.totalCards);
  document.getElementById("start-screen").style.display = "none";
  document.getElementById("quiz-screen").classList.add("active");
  renderTabs();
  renderStage();
}

// ============== CSV ==============
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (ch === "\r") { /* skip */ }
      else cell += ch;
    }
  }
  if (cell.length > 0 || row.length > 0) { row.push(cell); rows.push(row); }
  while (rows.length && rows[rows.length - 1].every(c => !c)) rows.pop();
  return rows;
}

function rowsToDecks(rows) {
  const decks = [];
  for (const row of rows) {
    if (!row[0]) continue;
    const entries = [];
    for (let i = 2; i + 2 < row.length; i += 3) {
      const card_no = (row[i] || "").trim();
      const cnt = parseInt(row[i + 2], 10);
      if (card_no && Number.isFinite(cnt) && cnt > 0) entries.push({ card_no, name: row[i + 1] || "", count: cnt });
    }
    if (entries.length) decks.push({ player: row[0], code: row[1] || "", entries });
  }
  return decks;
}

// ============== UPLOAD ==============
async function handleCardsUpload(file) {
  const status = document.getElementById("cards-status");
  const step1 = document.getElementById("step-1");
  const step2 = document.getElementById("step-2");
  const csvInput = document.getElementById("csv-upload");
  status.className = "step-status"; status.textContent = "";
  if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("カードデータの形式が不正です");
    const keys = Object.keys(obj);
    if (!keys.length) throw new Error("カードデータが空です");
    if (!keys.slice(0, 10).some(k => obj[k] && (obj[k].name || obj[k].type)))
      throw new Error("cards.json の形式が想定と異なります");
    CARDS = obj;
    const bp7 = keys.filter(k => setCode(k).toLowerCase() === "bp7").length;
    step1.classList.add("done");
    step2.classList.remove("disabled");
    csvInput.disabled = false;
    status.className = "step-status success";
    status.textContent = `✓ ${keys.length.toLocaleString()} 枚のカードを読み込みました`
      + (bp7 ? `（うち bp7: ${bp7} 枚）` : "（bp7 のカードは含まれていません）");
  } catch (err) {
    CARDS = null;
    step1.classList.remove("done"); step2.classList.add("disabled"); csvInput.disabled = true;
    status.className = "step-status error";
    status.textContent = "読み込みに失敗しました：" + err.message;
  }
}

async function handleDeckUpload(file, status) {
  if (!file) return;
  if (status) { status.className = "step-status"; status.textContent = ""; }
  if (!CARDS) {
    if (status) { status.className = "step-status error"; status.textContent = "先に STEP 1 で cards.json を読み込んでください"; }
    return;
  }
  try {
    const decks = rowsToDecks(parseCSV(await file.text()));
    if (!decks.length) throw new Error("デッキが見つかりませんでした。CSV形式を確認してください。");
    const agg = aggregate(decks, CARDS);
    if (!agg.member.length && !agg.series.length)
      throw new Error("カードがcards.jsonと一致しません。STEP1で正しいcards.jsonを読み込んだか確認してください。");
    DECKS = decks;
    console.log("[ラブカライフ! CUP]", {
      プレイヤー数: agg.totals.players, 集計枚数: agg.totals.totalCards,
      Q1シリーズ: agg.series, Q2メンバー: agg.member.slice(0, 10), Q3ユニット: agg.unit.slice(0, 10),
      Q4非ブレード: agg.noBlade.slice(0, 10), Q5PR: agg.prMember.slice(0, 10),
      Q6bp7メンバー: agg.bp7Member.slice(0, 10), Q7bp7ライブ: agg.bp7Live.slice(0, 10),
    });
    startQuiz(agg);
  } catch (err) {
    if (status) { status.className = "step-status error"; status.textContent = "読み込みに失敗しました：" + err.message; }
    else alert("読み込みに失敗しました：" + err.message);
  }
}

document.getElementById("cards-upload").addEventListener("change", async e => {
  await handleCardsUpload(e.target.files[0]); e.target.value = "";
});
document.getElementById("csv-upload").addEventListener("change", async e => {
  await handleDeckUpload(e.target.files[0], document.getElementById("csv-status")); e.target.value = "";
});
document.getElementById("csv-reupload").addEventListener("change", async e => {
  await handleDeckUpload(e.target.files[0], null); e.target.value = "";
});
renderSlots();

document.getElementById("btn-prev").addEventListener("click", () => goTo(CUR_PAGE - 1));
document.getElementById("btn-next").addEventListener("click", () => goTo(CUR_PAGE + 1));
document.addEventListener("keydown", e => {
  if (!document.getElementById("quiz-screen").classList.contains("active")) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "ArrowLeft") goTo(CUR_PAGE - 1);
  else if (e.key === "ArrowRight") goTo(CUR_PAGE + 1);
});
</script>
