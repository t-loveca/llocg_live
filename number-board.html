.wrap{
  max-width:1040px;margin:0 auto;
  padding:clamp(16px,4vw,30px) 18px calc(26px + env(safe-area-inset-bottom));
  display:grid;gap:clamp(14px,3vw,24px);justify-items:center;
}
/* ---------- title ---------- */
h1{
  margin:0;
  font-family:var(--marker);font-weight:400;
  font-size:clamp(25px,7.2vw,40px);line-height:1.1;letter-spacing:.03em;
  color:var(--crimson);
  background:#fff;
  padding:.42em .78em .5em;
  border-radius:8px;
  transform:rotate(-1.6deg);
  box-shadow:0 6px 0 rgba(23,124,160,.5);
  text-align:center;
}
/* ---------- stage ---------- */
.stage{
  position:relative;
  width:clamp(230px,84vw,360px);
  aspect-ratio:800/1331;
  filter:drop-shadow(0 16px 20px rgba(6,86,116,.34));
  will-change:transform;
}
.glow{
  position:absolute;inset:-8% -12%;
  background:radial-gradient(closest-side, rgba(255,255,255,.72), rgba(255,255,255,.28) 58%, rgba(255,255,255,0) 78%);
  pointer-events:none;
}
.char{position:relative;display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.board{
  position:absolute;left:var(--board-x);top:var(--board-y);
  width:46%;height:15.4%;
  transform:translate(-50%,-50%) rotate(var(--board-tilt));
  display:grid;place-items:center;
  container-type:inline-size;text-align:center;
}
.num{
  font-family:var(--marker);line-height:1;
  font-size:48px;font-size:58cqw;
  color:var(--crimson);letter-spacing:-.02em;
  text-shadow:0 .035em 0 rgba(16,27,51,.14);
}
.num.one{font-size:64cqw}
.num.rolling{color:#3B4A66;opacity:.9}
.num.pop{animation:pop .46s cubic-bezier(.18,.9,.28,1.1) both}
.hint{font-family:var(--marker);color:#4A5A78;font-size:14px;font-size:15cqw;line-height:1.35}
.hidden{display:none!important}
@keyframes pop{
  0%{transform:scale(.45) rotate(-8deg);opacity:0}
  55%{transform:scale(1.16) rotate(2.5deg);opacity:1}
  100%{transform:scale(1) rotate(0)}
}
@keyframes shake{
  0%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-2px,1px) rotate(-.55deg)}
  45%{transform:translate(2px,-1px) rotate(.5deg)}
  70%{transform:translate(-1px,-2px) rotate(.3deg)}
  100%{transform:translate(1px,1px) rotate(-.2deg)}
}
.stage.drawing{animation:shake .26s linear infinite}
@keyframes cheer{
  0%{transform:translateY(0) scale(1)}
  35%{transform:translateY(-14px) scale(1.025)}
  62%{transform:translateY(2px) scale(.995)}
  100%{transform:translateY(0) scale(1)}
}
.stage.cheer{animation:cheer .6s cubic-bezier(.22,.85,.3,1)}
.spark{
  position:absolute;left:var(--board-x);top:var(--board-y);
  width:10px;height:10px;border-radius:50%;pointer-events:none;
  animation:fly .85s ease-out forwards;
}
@keyframes fly{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}
}
/* ---------- ticket ---------- */
.ticket{
  width:min(100%,420px);
  background:var(--paper);color:#26324A;
  padding:22px 20px 18px;border-radius:6px;
  display:grid;gap:14px;
  box-shadow:inset 0 0 0 2px rgba(139,18,36,.12);
  -webkit-mask-image:radial-gradient(circle at 9px 0, transparent 5.2px, #000 5.8px);
  mask-image:radial-gradient(circle at 9px 0, transparent 5.2px, #000 5.8px);
  -webkit-mask-size:18px 100%;mask-size:18px 100%;
  -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;
}
.range{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px}
.step{
  width:38px;height:38px;border-radius:50%;border:2px solid #26324A;
  background:transparent;color:#26324A;font-size:19px;font-weight:900;line-height:1;
  cursor:pointer;transition:background .12s,color .12s;
}
.step:hover{background:#26324A;color:var(--paper)}
.step:active{transform:translateY(1px)}
#max{
  width:82px;padding:6px 4px;text-align:center;
  font-family:var(--marker);font-size:30px;color:var(--crimson);
  background:transparent;border:0;border-bottom:3px solid rgba(38,50,74,.35);
  -moz-appearance:textfield;
}
#max:focus{outline:none;border-bottom-color:var(--crimson)}
#max::-webkit-outer-spin-button,#max::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{
  border:1.5px solid rgba(38,50,74,.3);background:transparent;color:#26324A;
  border-radius:999px;padding:5px 13px;font-family:var(--jp);font-weight:700;font-size:13px;cursor:pointer;
}
.chip:hover{border-color:var(--crimson);color:var(--crimson)}
.chip[aria-pressed="true"]{background:#26324A;border-color:#26324A;color:var(--paper)}
.draw{
  width:100%;padding:16px;border:0;border-radius:999px;cursor:pointer;
  background:var(--crimson);color:var(--paper);
  font-family:var(--jp);font-weight:900;font-size:19px;letter-spacing:.12em;
  box-shadow:0 5px 0 #5C0A17;
  transition:transform .08s,box-shadow .08s,background .15s;
}
.draw:hover{background:#9C1A2D}
.draw:active{transform:translateY(4px);box-shadow:0 1px 0 #5C0A17}
.draw[disabled]{background:#8E97A8;box-shadow:0 5px 0 #6B7382;cursor:default;transform:none}
.log{display:grid;gap:8px;border-top:1.5px dashed rgba(38,50,74,.3);padding-top:12px}
.log-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.1em;color:rgba(38,50,74,.65)}
.clear{border:0;background:transparent;color:rgba(38,50,74,.65);font-family:var(--jp);font-weight:700;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.clear:hover{color:var(--crimson)}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.mark{
  font-family:var(--marker);font-size:17px;color:#26324A;
  border:1.5px solid rgba(38,50,74,.28);border-radius:6px;
  min-width:34px;padding:2px 6px;text-align:center;
}
.mark.latest{background:var(--lemon);border-color:var(--lemon)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--crimson);outline-offset:3px}
@media (min-width:880px){
  .wrap{grid-template-columns:auto minmax(320px,380px);align-items:center;justify-items:start;
        column-gap:40px;row-gap:16px;padding-top:30px}
  h1{grid-column:1/-1;justify-self:center}
  .stage{width:min(360px,48vh);grid-row:2}
  .ticket{grid-row:2}
}
@media (prefers-reduced-motion:reduce){
  .stage.drawing,.stage.cheer{animation:none}
  .spark{display:none}
  .num.pop{animation-duration:.2s}
}
</style>
</head>

    <div class="board">
      <div class="hint" id="hint">ボタンを<br>おしてね</div>
      <div class="num hidden" id="num" aria-hidden="true">1</div>
    </div>
  </div>

  <section class="ticket">
    <div class="range">
      <span>1 から</span>
      <button class="step" id="minus" type="button" aria-label="上限を1減らす">−</button>
      <input id="max" type="number" min="2" max="99" step="1" value="30" inputmode="numeric" aria-label="番号の上限（2〜99）">
      <button class="step" id="plus" type="button" aria-label="上限を1増やす">＋</button>
      <span>まで</span>
    </div>

    <div class="chips" id="chips">
      <button class="chip" type="button" data-v="10">10</button>
      <button class="chip" type="button" data-v="20">20</button>
      <button class="chip" type="button" data-v="30">30</button>
      <button class="chip" type="button" data-v="50">50</button>
      <button class="chip" type="button" data-v="99">99</button>
    </div>

    <button class="draw" id="draw" type="button">抽選する</button>

    <div class="log hidden" id="log">
      <div class="log-head"><span>これまでの結果</span><button class="clear" id="clear" type="button">履歴を消す</button></div>
      <div class="marks" id="marks"></div>
    </div>
    <p class="sr" id="live" role="status" aria-live="polite"></p>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage=$('stage'), numEl=$('num'), hintEl=$('hint'), drawBtn=$('draw'),
        maxEl=$('max'), logEl=$('log'), marksEl=$('marks'), liveEl=$('live');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let history = [], rolling = false;

  /* ---- 上限 ---- */
  const getMax = () => {
    let v = parseInt(maxEl.value, 10);
    if (!Number.isFinite(v)) v = 30;
    return Math.min(99, Math.max(2, v));
  };
  const setMax = v => { maxEl.value = Math.min(99, Math.max(2, v)); syncChips(); };
  const syncChips = () => document.querySelectorAll('.chip')
    .forEach(c => c.setAttribute('aria-pressed', String(+c.dataset.v === getMax())));
  $('minus').onclick = () => setMax(getMax() - 1);
  $('plus').onclick  = () => setMax(getMax() + 1);
  maxEl.addEventListener('change', () => setMax(getMax()));
  maxEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); maxEl.blur(); start(); }});
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => setMax(+c.dataset.v));

  /* ---- 表示 ---- */
  const show = (n, cls) => {
    hintEl.classList.add('hidden');
    numEl.classList.remove('hidden');
    numEl.textContent = n;
    numEl.classList.toggle('one', String(n).length === 1);
    numEl.classList.remove('rolling', 'pop');
    if (cls) { void numEl.offsetWidth; numEl.classList.add(cls); }
  };
  const sparkle = () => {
    if (reduce) return;
    const colors = ['#F7D046', '#5CD3F2', '#8B1224', '#FFFFFF'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 130;
      s.style.setProperty('--dx', `${Math.cos(a) * d}px`);
      s.style.setProperty('--dy', `${Math.sin(a) * d * .7}px`);
      s.style.background = colors[i % colors.length];
      s.style.width = s.style.height = `${5 + Math.random() * 8}px`;
      s.style.animationDelay = `${Math.random() * .1}s`;
      stage.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    }
  };

  /* ---- 抽選 ---- */
  const start = () => {
    if (rolling) return;
    const max = getMax();
    rolling = true;
    drawBtn.disabled = true;
    drawBtn.textContent = '抽選中…';
    stage.classList.remove('cheer');
    stage.classList.add('drawing');

    const result = 1 + Math.floor(Math.random() * max);
    const growth = reduce ? 1.30 : 1.12;
    let delay = reduce ? 120 : 45, last = null;

    const tick = () => {
      let f;
      do { f = 1 + Math.floor(Math.random() * max); } while (max > 1 && f === last);
      last = f;
      show(f);
      numEl.classList.add('rolling');
      if (delay < 240) { delay *= growth; setTimeout(tick, delay); }
      else if (delay < 620) { delay *= 1.5; setTimeout(tick, delay); }
      else { setTimeout(land, reduce ? 240 : 380); }
    };
    const land = () => {
      stage.classList.remove('drawing');
      stage.classList.add('cheer');
      show(result, 'pop');
      sparkle();
      history.unshift(result);
      renderLog();
      liveEl.textContent = `結果は ${result} 番です`;
      rolling = false;
      drawBtn.disabled = false;
      drawBtn.textContent = 'もういちど';
    };
    setTimeout(tick, 100);
  };
  drawBtn.onclick = start;

  /* ---- 履歴 ---- */
  const renderLog = () => {
    logEl.classList.toggle('hidden', !history.length);
    marksEl.innerHTML = '';
    history.slice(0, 24).forEach((n, i) => {
      const s = document.createElement('span');
      s.className = 'mark' + (i === 0 ? ' latest' : '');
      s.textContent = n;
      marksEl.appendChild(s);
    });
  };
  $('clear').onclick = () => { history = []; renderLog(); };

  syncChips();
})();
</script>
</body>
</html>
