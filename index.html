<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webタイマー</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #222;
            background-size: cover;
            background-position: center;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            transition: color 0.3s;
            overflow: hidden;
        }

        /* タイマー表示 */
        #timer-display {
            font-size: 30vw;
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            user-select: none;
            z-index: 10;
        }

        /* メニューを開くボタン */
        #menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 15;
            font-size: 1.8rem;
            opacity: 0.15;
            transition: opacity 0.3s, transform 0.2s;
        }

        #menu-btn:hover {
            opacity: 1;
            transform: rotate(30deg);
        }

        /* 操作・設定用の別画面 */
        #control-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 15, 15, 0.95);
            z-index: 30;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            overflow-y: auto;
            padding: 20px 0;
        }

        .control-group {
            display: flex;
            gap: 20px;
        }

        .control-screen-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, opacity 0.2s;
        }
        .control-screen-btn:active { transform: scale(0.95); }

        #start-btn { background-color: #2ecc71; color: white; }
        #stop-btn { background-color: #e74c3c; color: white; }
        #reset-btn { background-color: #f39c12; color: white; }
        
        #start-btn:hover { background-color: #27ae60; }
        #stop-btn:hover { background-color: #c0392b; }
        #reset-btn:hover { background-color: #d68910; }

        /* 設定エリア */
        .settings-area {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 320px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .setting-item label.title { font-size: 0.95rem; color: #ccc; font-weight: bold; }
        .setting-item input[type="text"] { padding: 10px; font-size: 1.2rem; text-align: center; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        .setting-item input[type="file"], .setting-item input[type="color"] { padding: 5px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; width: 100%; box-sizing: border-box;}

        /* チェックボックスのスタイル */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 1rem;
            color: #eee;
        }
        .checkbox-label input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
        }

        hr { border: none; border-top: 1px solid #555; margin: 5px 0; }

        #close-menu-btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #close-menu-btn:hover { background-color: #777; }
    </style>
</head>
<body>

    <button id="menu-btn" title="操作パネルを開く">⚙️</button>

    <div id="timer-display">30:00</div>

    <div id="control-screen">
        <h2 style="margin:0; color:#fff; font-size: 2rem;">操作パネル</h2>
        
        <div class="control-group">
            <button id="start-btn" class="control-screen-btn">スタート</button>
            <button id="stop-btn" class="control-screen-btn">ストップ</button>
            <button id="reset-btn" class="control-screen-btn">リセット</button>
        </div>

        <div class="settings-area">
            <div class="setting-item">
                <label class="title">初期時間 (MM:SS)</label>
                <input type="text" id="initial-time-input" value="30:00">
            </div>

            <hr>

            <div class="setting-item">
                <label class="title">通知設定（終了時は必ず鳴ります）</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" class="alarm-chk" value="900" checked> 残り15分</label>
                    <label class="checkbox-label"><input type="checkbox" class="alarm-chk" value="600" checked> 残り10分</label>
                    <label class="checkbox-label"><input type="checkbox" class="alarm-chk" value="300" checked> 残り5分</label>
                    <label class="checkbox-label"><input type="checkbox" class="alarm-chk" value="120" checked> 残り2分</label>
                    <label class="checkbox-label"><input type="checkbox" class="alarm-chk" value="60" checked> 残り1分</label>
                </div>
            </div>
            
            <hr>

            <div class="setting-item">
                <label class="title">文字色</label>
                <input type="color" id="color-input" value="#ffffff">
            </div>
            <div class="setting-item">
                <label class="title">背景画像</label>
                <input type="file" id="bg-input" accept="image/*">
            </div>
        </div>

        <button id="close-menu-btn">タイマー画面に戻る</button>
    </div>

    <script>
        const display = document.getElementById('timer-display');
        const menuBtn = document.getElementById('menu-btn');
        const controlScreen = document.getElementById('control-screen');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resetBtn = document.getElementById('reset-btn');
        
        const initialTimeInput = document.getElementById('initial-time-input');
        const colorInput = document.getElementById('color-input');
        const bgInput = document.getElementById('bg-input');

        let totalSeconds = 30 * 60; 
        let currentSeconds = totalSeconds;
        let timerInterval = null;
        let audioTimeoutId = null; 

        // 通知時間(秒)と音声ファイルのマッピング
        const ALARMS = {
            900: '15.wav', // 15:00
            600: '10.wav', // 10:00
            300: '5.wav',  // 05:00
            120: '2.wav',  // 02:00
            60:  '1.wav'   // 01:00 (追加)
        };
        const END_AUDIO = 'end.wav';

        function parseTimeToSeconds(timeStr) {
            const parts = timeStr.split(':');
            if (parts.length === 2) {
                const m = parseInt(parts[0], 10);
                const s = parseInt(parts[1], 10);
                if (!isNaN(m) && !isNaN(s)) return m * 60 + s;
            }
            return 30 * 60; 
        }

        // 音声再生ロジック（1回目 → 5秒待機 → 2回目）
        function playAudioTwice(fileName) {
            if (audioTimeoutId) {
                clearTimeout(audioTimeoutId);
                audioTimeoutId = null;
            }

            const audio1 = new Audio(fileName);
            
            audio1.play().catch(e => {
                console.warn(`${fileName} の再生に失敗しました。`, e);
            });

            audio1.onended = () => {
                audioTimeoutId = setTimeout(() => {
                    const audio2 = new Audio(fileName);
                    audio2.play().catch(e => console.warn(`2回目の再生に失敗しました。`, e));
                }, 5000); 
            };
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            display.textContent = formatTime(currentSeconds);
        }

        function applySettings() {
            if (!timerInterval) {
                const newSeconds = parseTimeToSeconds(initialTimeInput.value);
                if (totalSeconds !== newSeconds) {
                    totalSeconds = newSeconds;
                    currentSeconds = totalSeconds;
                    updateDisplay();
                }
            }
        }

        function startTimer() {
            if (timerInterval) return;

            applySettings();

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            controlScreen.style.display = 'none';

            timerInterval = setInterval(() => {
                if (currentSeconds > 0) {
                    currentSeconds--;
                    updateDisplay();

                    // 通知タイミングのチェック
                    if (ALARMS[currentSeconds]) {
                        // 対象のチェックボックスがオンになっているか確認
                        const chk = document.querySelector(`input.alarm-chk[value="${currentSeconds}"]`);
                        if (chk && chk.checked) {
                            playAudioTwice(ALARMS[currentSeconds]);
                        }
                    }

                    if (currentSeconds === 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        playAudioTwice(END_AUDIO);
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (audioTimeoutId) {
                clearTimeout(audioTimeoutId);
                audioTimeoutId = null;
            }
        }

        function resetTimer() {
            stopTimer();
            totalSeconds = parseTimeToSeconds(initialTimeInput.value);
            currentSeconds = totalSeconds;
            updateDisplay();
        }

        // イベントリスナー
        menuBtn.addEventListener('click', () => {
            controlScreen.style.display = 'flex';
        });

        closeMenuBtn.addEventListener('click', () => {
            applySettings();
            controlScreen.style.display = 'none';
        });

        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', stopTimer);
        resetBtn.addEventListener('click', resetTimer);

        colorInput.addEventListener('input', (e) => {
            document.body.style.color = e.target.value;
        });

        bgInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.body.style.backgroundImage = `url('${event.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        });

        updateDisplay();
    </script>
</body>
</html>
