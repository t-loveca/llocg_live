<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f08a2a">
<meta name="robots" content="noindex">
<title>ひらめき収穫祭｜ラブカライフ！CUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* タイトル画像から拾った色 */
  --pink:#e8407e;      /* ラブカライフ！ */
  --pink-deep:#c42a66;
  --orange:#f08a2a;    /* ひらめき */
  --red:#d9472b;       /* 紅葉・収穫 */
  --olive:#8c8a2c;     /* 祭 */
  --sky:#3d9be9;       /* CUP */
  --wood:#8a5a36;      /* テーブル */
  --wood-deep:#5e3a20;
  --cream:#fff8ec;
  --ink:#4a2c18;
  --ink-soft:#7d5a3f;
  --line:#f3d9b6;
  --ng:#d1372b;
  --round:"M PLUS Rounded 1c","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);background:#f7d9b0;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%;overflow-x:hidden;
}
/* 背景：タイトル画像をぼかしたもの＋淡いクリーム */
#bg{position:fixed;inset:0;z-index:0;background:#f7d9b0 center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,250,240,.55) 0%,rgba(255,244,226,.72) 45%,rgba(250,226,192,.85) 100%)}

/* ---------- 落ち葉 ---------- */
#leaves{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.leaf{position:absolute;top:-60px;will-change:transform;animation:fall linear infinite}
.leaf svg{display:block;animation:sway ease-in-out infinite alternate}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0)}}
@keyframes sway{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
@media (prefers-reduced-motion:reduce){#leaves{display:none}}

/* ---------- 枠 ---------- */
.wrap{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:0 14px calc(36px + env(safe-area-inset-bottom))}

/* ロゴ風文字：白フチ（本体）の上にグラデ文字（::after）を重ねる */
.logo{position:relative;display:inline-block;font-family:var(--round);font-weight:900;line-height:1.2;
  color:#fff;-webkit-text-stroke:var(--stroke,8px) #fff;filter:drop-shadow(0 3px 0 rgba(160,70,30,.35))}
.logo::after{content:attr(data-text);position:absolute;inset:0;-webkit-text-stroke:0;
  background:linear-gradient(90deg,var(--orange),var(--pink) 55%,var(--red));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- タイトル ---------- */
.hero{margin:0 -14px 16px;position:relative}
.hero img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#f7d9b0}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;
  background:linear-gradient(180deg,transparent,rgba(255,244,226,.0))}
@media (min-width:748px){.hero{margin:16px 0 18px}.hero img{border-radius:20px;box-shadow:0 14px 30px -14px rgba(120,50,20,.55);border:4px solid #fff}}

.welcome{text-align:center;margin:4px 0 14px}
.welcome .sub{display:inline-block;font-family:var(--round);font-weight:800;font-size:13px;color:#fff;
  background:var(--sky);border-radius:999px;padding:2px 14px;letter-spacing:.08em}
.welcome .big{--stroke:7px;font-size:clamp(20px,5.8vw,28px);margin:8px 0 0;white-space:nowrap}

/* ---------- カード ---------- */
.card{position:relative;background:rgba(255,253,248,.96);border:3px solid #fff;border-radius:22px;
  padding:20px 18px;margin:0 0 16px;box-shadow:0 10px 24px -12px rgba(120,55,20,.45)}
.card p{margin:0 0 10px}.card p:last-child{margin-bottom:0}
.card h2{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-family:var(--round);font-weight:800;font-size:18px;color:var(--wood-deep)}
.card h2 .ic{width:24px;height:24px;flex:0 0 24px}
strong{color:var(--pink-deep)}
small{color:var(--ink-soft)}
.prize{background:linear-gradient(135deg,#fff6e6 0%,#ffe3ec 100%)}
.prize h2{color:var(--pink-deep)}
ul.rules{margin:0;padding:0;list-style:none}
ul.rules li{position:relative;padding-left:22px;margin:0 0 8px}
ul.rules li::before{content:"";position:absolute;left:0;top:.45em;width:14px;height:14px;background:var(--orange);
  -webkit-mask:var(--maple-mask) center/contain no-repeat;mask:var(--maple-mask) center/contain no-repeat}
ul.rules li:nth-child(2n)::before{background:var(--red)}

/* ---------- 入力 ---------- */
label.lbl{display:block;font-weight:700;font-size:14px;margin:0 0 6px;color:var(--ink-soft)}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:14px;
  border:2px solid var(--line);background:#fff;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
input[type=text]:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(240,138,42,.2)}
.btn{display:block;width:100%;margin-top:14px;padding:15px 18px;border:3px solid #fff;border-radius:999px;
  font-family:var(--round);font-weight:900;font-size:19px;letter-spacing:.08em;color:#fff;cursor:pointer;
  background:linear-gradient(90deg,var(--orange) 0%,var(--pink) 100%);
  text-shadow:0 2px 0 rgba(150,40,40,.35);
  box-shadow:0 5px 0 #b8335f,0 12px 20px -8px rgba(196,42,102,.6);
  transition:transform .08s,box-shadow .08s,opacity .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8335f}
.btn[disabled]{opacity:.65;cursor:wait}
.msg{min-height:1.6em;margin:10px 0 0;font-weight:700;text-align:center}
.msg.ng{color:var(--ng)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ---------- 問題ページ ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 6px}
.topbar .mini{font-family:var(--round);font-weight:900;font-size:15px;line-height:1.2;--stroke:5px}
.topbar .mini small{display:block;font-size:10px;color:var(--sky);-webkit-text-fill-color:var(--sky);letter-spacing:.06em}
.progress{display:flex;gap:4px;flex-wrap:nowrap}
.progress span{width:20px;height:20px;background:#c9b48f;opacity:.45;
  -webkit-mask:var(--maple-mask) center/contain no-repeat;mask:var(--maple-mask) center/contain no-repeat}
.progress span.done{opacity:1;background:var(--red)}
.progress span.now{opacity:1;background:var(--orange);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.2) rotate(10deg)}}

.q-head{text-align:center;margin:8px 0 12px}
.q-badge{display:inline-block;font-family:var(--round);font-weight:900;color:#fff;font-size:15px;letter-spacing:.1em;
  background:linear-gradient(90deg,var(--orange),var(--pink));border:3px solid #fff;border-radius:999px;padding:2px 18px;
  box-shadow:0 3px 8px -3px rgba(196,42,102,.6)}
.q-title{font-family:var(--round);font-weight:800;font-size:21px;line-height:1.45;margin:10px 0 0;color:var(--wood-deep);
  text-wrap:balance;word-break:auto-phrase;text-shadow:0 0 6px #fff,0 0 2px #fff}

/* 問題画像：16:9を画面幅いっぱいに */
.q-figure{margin:0 -14px 8px;position:relative}
.q-figure img{display:block;width:100%;height:auto;background:#fff;cursor:zoom-in;border-top:3px solid #fff;border-bottom:3px solid #fff}
.q-figure .zoom{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;color:#fff;background:rgba(74,44,24,.7);
  border-radius:999px;padding:2px 10px;pointer-events:none}
@media (min-width:748px){.q-figure{margin:0 0 10px}.q-figure img{border:4px solid #fff;border-radius:18px;box-shadow:0 12px 26px -14px rgba(120,50,20,.55)}}
.q-tip{text-align:center;font-size:12px;color:var(--ink-soft);margin:0 0 14px}
.howto{font-size:15px}

/* 拡大表示 */
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(30,15,5,.92);display:none;align-items:center;justify-content:center;padding:10px}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#lightbox .close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;color:#fff;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.18);border-radius:999px;padding:4px 14px}

/* ---------- 正解演出 ---------- */
#seikai{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,#fff7d6 0%,#ffd28a 40%,#f59a3c 75%,#e0563a 100%)}
#seikai.on{display:flex;animation:bgin .25s ease-out}
@keyframes bgin{from{opacity:0}to{opacity:1}}
#seikai .rays{position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;
  background:repeating-conic-gradient(rgba(255,255,255,.38) 0 9deg,rgba(255,255,255,0) 9deg 18deg);
  animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#seikai .word{position:relative;z-index:2;--stroke:14px;font-size:min(30vw,190px);letter-spacing:.02em;
  animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
#seikai .word.logo{filter:drop-shadow(0 8px 0 rgba(150,50,20,.4))}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-4deg)}}
#seikai .sub{position:relative;z-index:2;margin-top:10px;font-family:var(--round);font-weight:900;font-size:20px;color:#fff;
  background:var(--pink);border:3px solid #fff;border-radius:999px;padding:4px 22px;
  animation:rise .5s .35s ease-out both;box-shadow:0 4px 10px -4px rgba(150,30,60,.6)}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
#seikai .tap{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));z-index:2;font-size:12px;color:#fff;font-weight:700;opacity:0;animation:rise .4s 1.2s both}
.burst{position:absolute;left:50%;top:50%;z-index:1;font-size:34px;line-height:1;will-change:transform,opacity;
  animation:fly 1.4s cubic-bezier(.15,.7,.35,1) forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}
  80%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(var(--r));opacity:0}}

/* ---------- 達成 ---------- */
.clear{text-align:center;padding:20px 16px 24px;background:linear-gradient(180deg,#fffaf0 0%,#ffe9d2 100%)}
.clear .basket{font-size:40px;line-height:1;margin:0 0 6px;letter-spacing:2px}
.clear .player{font-family:var(--round);font-weight:900;font-size:26px;color:var(--wood-deep);margin:0 0 2px;word-break:break-all}
.clear .congrats{font-size:19px;font-weight:700;margin:4px 0 10px}
.clear .big{--stroke:7px;font-size:27px;line-height:1.35;margin:4px 0 12px}
.clear .show{display:block;margin-top:14px;padding:10px 14px;border-radius:16px;color:#fff;font-weight:700;
  background:linear-gradient(90deg,var(--orange),var(--pink));border:3px solid #fff;box-shadow:0 6px 14px -8px rgba(196,42,102,.7)}
.clear .stamp{margin-top:12px;font-size:13px;color:var(--ink-soft)}
.clear-hero{margin:12px -14px 14px}
.clear-hero img{display:block;width:100%;height:auto}
@media (min-width:748px){.clear-hero{margin:16px 0}.clear-hero img{border-radius:18px;border:4px solid #fff}}


/* 秋の味覚の飾り */
.card .deco{position:absolute;top:-18px;right:-8px;width:46px;height:46px;transform:rotate(14deg);filter:drop-shadow(0 3px 2px rgba(90,40,10,.25))}
.card .deco.deco-l{right:auto;left:-8px;transform:rotate(-16deg)}
.harvest-row{display:flex;justify-content:center;gap:10px;margin:10px 0 0}
.harvest-row svg{width:34px;height:34px;filter:drop-shadow(0 2px 1px rgba(90,40,10,.2))}
.harvest-row svg:nth-child(2n){transform:translateY(4px) rotate(-8deg)}
.harvest-row svg:nth-child(2n+1){transform:rotate(8deg)}
.shelf{margin:22px 4px 0}
.shelf-items{display:flex;justify-content:space-around;align-items:flex-end;padding:0 8px;margin-bottom:-6px;position:relative;z-index:1}
.shelf-items svg{filter:drop-shadow(0 3px 1px rgba(70,30,10,.25))}
.shelf-items svg:nth-child(3n){transform:rotate(-10deg)}
.shelf-items svg:nth-child(3n+1){transform:rotate(8deg)}
.plank{height:14px;border-radius:7px;background:linear-gradient(180deg,#b07a4c 0%,#8a5a36 55%,#6d4428 100%);
  box-shadow:0 6px 10px -6px rgba(70,30,10,.6),inset 0 2px 0 rgba(255,255,255,.25)}
.clear-img{display:block;width:100%;max-width:420px;height:auto;margin:0 auto 14px;border-radius:14px;border:4px solid #fff;box-shadow:0 8px 18px -10px rgba(120,50,20,.55)}
footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:16px}
.fade-in{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="leaves" aria-hidden="true"></div>
<main class="wrap" id="app"></main>
<div id="lightbox" role="dialog" aria-label="画像の拡大表示"><span class="close">× 閉じる</span><img alt=""></div>
<div id="seikai" role="alert" aria-live="assertive">
  <div class="rays"></div>
  <div class="word logo" data-text="正解！">正解！</div>
  <div class="sub">カードを収穫しました！</div>
  <div class="tap">タップで次へ</div>
</div>

// ---------- 暗号ユーティリティ ----------
const enc = new TextEncoder(), dec = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...u));

function norm(s) {
  return s.normalize("NFKC").toUpperCase().replace(/[ー－−‐‑‒–—―ｰ]/g, "-");
}
// 入力から「カード番号らしき部分文字列」をすべて取り出す（含まれていれば正解、を実現するため）
// 「入力の中に答えの文字列が含まれているか」を判定するため、
// 入力から答えと同じ長さの部分文字列をすべて切り出して候補にする（区切り位置は問わない）。
function windows(s, len, hy) {
  const out = new Set();
  for (let i = 0; i + len <= s.length; i++) {
    const w = s.slice(i, i + len);
    if (w.split("-").length - 1 === hy) out.add(w); // ハイフンの数が答えと違うものは試すまでもなく不一致
  }
  return [...out];
}
async function deriveKey(pass, saltB64) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64d(saltB64), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function aesDecrypt(key, ivB64, ctB64) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(ivB64) }, key, b64d(ctB64)));
}
async function openStage(idx, rawKey) {
  const st = DATA.stages[idx];
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  return JSON.parse(dec.decode(await aesDecrypt(key, st.iv, st.ct)));
}
async function tryUnlock(nextIdx, input) {
  const st = DATA.stages[nextIdx];
  const s = norm(input).slice(0, 200);
  for (const w of st.wraps) {
    for (const cand of windows(s, w.len, w.hy)) {
      try { return await aesDecrypt(await deriveKey(cand, w.salt), w.iv, w.ct); } catch (_) {}
    }
  }
  return null;
}

// ---------- クリア者の自動記録（Googleスプレッドシートへ送信） ----------
// 送れなかった記録は端末に残し、通信が戻ったら再送する
function queueRecord(item) {
  if (!DATA.recordUrl) return;
  state.outbox = state.outbox || [];
  state.outbox.push(item);
  save(state);
  flushRecords();
}
let flushing = false;
async function flushRecords() {
  if (!DATA.recordUrl || flushing || !state || !state.outbox || !state.outbox.length) return;
  flushing = true;
  try {
    while (state.outbox.length) {
      const item = state.outbox[0];
      let res;
      try {
        const r = await fetch(DATA.recordUrl, {
          method: "POST", redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ ...item, name: state.name, cid: state.cid }),
        });
        res = await r.json();
      } catch (_) { break; } // 通信失敗 → あとで再送
      if (!(res && res.ok) && !(res && res.error === "bad token")) {
        break; // サーバー側の一時的なエラー → あとで再送
      }
      state.outbox.shift();
      save(state);
    }
  } finally {
    flushing = false;
  }
}
setInterval(flushRecords, 15000);
window.addEventListener("online", flushRecords);

function renderTitle() {
  show(`<div>
    <div class="hero">${DATA.titleImage ? `<img src="${esc(DATA.titleImage)}" alt="ラブカライフ！CUP ひらめき収穫祭">` : ""}</div>
    <div class="welcome">
      <span class="sub">ラブカライフ！CUP サブイベント</span><br>
      <span class="big logo" data-text="「ひらめき収穫祭」へようこそ！">「ひらめき収穫祭」へようこそ！</span>
      <div class="harvest-row">${["kuri","budou","kaki","ringo","kinoko"].map(k=>food(k)).join("")}</div>
    </div>
    <section class="card">
      <p>ここでは、さまざまな謎を解きながら、<strong>答えとなるカード</strong>を見つけていただきます。</p>
      <p>ひらめきとラブカの知識を頼りに、謎に隠されたカードを見つけ出してください！</p>
      <p>ぜひ、「謎解きの秋」をお楽しみください！</p>
    </section>
    <section class="card prize">${food("kaki","deco")}
      <h2>${ICON_FOOD("ringo")}景品</h2>
      <p>すべての謎をクリアした方のうち、<strong>先着5名の方にはお好きなPRパックをプレゼント！</strong></p>
      <p>6人目以降の方も、謎解き達成者として<strong>noteにお名前を掲載</strong>させていただきます。</p>
    </section>
    <section class="card">
      <h2>${ICON_FOOD("kuri")}ルール</h2>
      <ul class="rules">
        <li>各問題の指示に従って、答えを入力してください。</li>
        <li>ネット検索はもちろんOKです。デッキログやLL-Fans、その他のイベントページなども自由にご利用ください。</li>
        <li>カードの名前や効果など、<strong>ラブカに関する知識が謎を解くヒント</strong>になる場合があります。</li>
        <li>SNSなどで、問題の答えやネタバレを公開することはお控えください。</li>
      </ul>
    </section>
    <section class="card">${food("donguri","deco deco-l")}
      <form id="f" autocomplete="off">
        <label class="lbl" for="pname">プレイヤー名</label>
        <input type="text" id="pname" maxlength="30" placeholder="お名前を入力" required>
        <button class="btn" type="submit">謎解きをはじめる</button>
        <p class="msg ng" id="m"></p>
      </form>
    </section>
    ${SHELF}<footer>ラブカライフ！CUP</footer>
  </div>`);
  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("pname").value.trim();
    if (!name) { document.getElementById("m").textContent = "プレイヤー名を入力してください"; return; }
    state = { name, idx: 0, key: DATA.firstKey, cid: b64e(crypto.getRandomValues(new Uint8Array(9))).replace(/[+/=]/g, "") };
    save(state);
    route();
  });
}

async function renderStage() {
  let p;
  try { p = await openStage(state.idx, b64d(state.key)); }
  catch (_) { clearSave(); state = null; return renderTitle(); }
  if (p.kind === "clear") return renderClear(p);

  show(`<div>
    ${topbar(state.idx)}
    <div class="q-head"><span class="q-badge">${esc(p.label)}</span><h1 class="q-title">${esc(p.title)}</h1></div>
    ${p.lead ? `<section class="card"><p>${p.lead}</p></section>` : ""}
    ${p.image ? `<figure class="q-figure" style="margin-top:0"><img id="qimg" src="${esc(p.image)}" alt="${esc(p.label)} 問題画像"></figure>
      <p class="q-tip">画像をタップすると拡大表示／横向きにすると大きく見られます</p>` : ""}
    <section class="card">
      <h2>${ICON_FOOD("budou")}回答方法</h2>
      <p class="howto">${p.howto}</p>
      <form id="f" autocomplete="off">
        <label class="lbl" for="ans" style="margin-top:12px">カード番号</label>
        <input type="text" id="ans" placeholder="${esc(DATA.placeholder || "")}" autocapitalize="characters" spellcheck="false">
        <button class="btn" type="submit" id="b">答えを送る</button>
        <p class="msg" id="m"></p>
      </form>
    </section>
    ${SHELF}<footer>${esc(state.name)} さん 挑戦中</footer>
  </div>`);

  const qimg = document.getElementById("qimg");
  if (qimg) qimg.addEventListener("click", () => zoom(qimg.src));

  const f = document.getElementById("f"), b = document.getElementById("b"), m = document.getElementById("m"), inp = document.getElementById("ans");
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const v = inp.value.trim();
    if (!v) { m.className = "msg ng"; m.textContent = "答えを入力してください"; return; }
    b.disabled = true; m.className = "msg"; m.textContent = "判定中…";
    const raw = await tryUnlock(state.idx + 1, v);
    b.disabled = false;
    if (!raw) {
      m.className = "msg ng"; m.textContent = "ざんねん…ちがうようです";
      f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      return;
    }
    inp.blur();
    m.textContent = "";
    state.idx += 1; state.key = b64e(raw);
    const isClear = state.idx === DATA.stages.length - 1;
    if (isClear && !state.clearedAt) state.clearedAt = Date.now();
    save(state);
    if (isClear) try {
      const np = await openStage(state.idx, raw);
      if (isClear && np.rt) queueRecord({ token: np.rt, at: Date.now() });
    } catch (_) {}
    await celebrate();
    route();
  });
}

function renderClear(p) {
  const t = new Date(state.clearedAt || Date.now());
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${t.getMonth() + 1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
  show(`<div>
    ${topbar(totalQ)}
    ${DATA.titleImage ? `<div class="clear-hero"><img src="${esc(DATA.titleImage)}" alt=""></div>` : ""}
    <section class="card clear">
      <p class="player">${esc(state.name)} さん</p>
      <p class="congrats">おめでとうございます！</p>
      <p class="big"><span class="logo" data-text="すべてのカードを">すべてのカードを</span><br><span class="logo" data-text="収穫できました！">収穫できました！</span></p>
      <p>${p.message}</p>
      <div class="show">この画面を運営スタッフまでお見せください！</div>
      <p class="stamp">クリア時刻 ${stamp}</p>
    </section>
    ${SHELF}
  </div>`);
}

function route() {
  if (/[?&]reset\b/.test(location.search)) { clearSave(); state = null; history.replaceState(null, "", location.pathname); }
  if (!state || !state.key) return renderTitle();
  renderStage();
}

if (!window.crypto || !crypto.subtle) {
  app.innerHTML = `<div class="card" style="margin-top:40px">このブラウザでは動作しません。最新のブラウザで <strong>https://</strong> のURLから開いてください。</div>`;
} else {
  route();
  flushRecords();
}
})();
</script>
</body>
</html>
